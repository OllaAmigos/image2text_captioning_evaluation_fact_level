[project]
name = "i2t-caption-eval"
version = "0.1.0"
description = "Fact-based precision/recall evaluation of image captions and caption rewrites"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
